name: RuView Sensing Server
version: "0.1.3"
slug: ruview
description: >-
  RuView WiFi sensing server: receives CSI from ESPHome ESP32 nodes and
  publishes presence, motion and person count to Home Assistant over MQTT.
url: https://github.com/david-dvinskykh/ruview/tree/main/integrations/home-assistant-addon
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
host_network: true
watchdog: tcp://[HOST]:[PORT:8097]
webui: http://[HOST]:[PORT:8097]/
ports:
  8097/tcp: 8097
  8096/tcp: 8096
  5005/udp: 5005
ports_description:
  8097/tcp: RuView UI and REST API
  8096/tcp: RuView WebSocket stream
  5005/udp: CSI frames from ESP32 nodes
services:
  - mqtt:need
hassio_api: true
options:
  http_port: 8097
  ws_port: 8096
  udp_port: 5005
  udp_allow: 192.168.0.0/16
  api_token: ""
  allowed_hosts: 192.168.1.1,homeassistant.local,ruview-installation.local
  privacy_mode: true
  node_positions: "1:-1.60,-1.08,1.5;2:-9.06,-0.07,1.5;3:-6.25,2.91,1.5;4:-10.21,-3.43,1.5;5:-2.92,-3.51,1.5;6:-8.02,2.82,1.5;7:-4.53,-2.38,1.5;8:-2.69,-0.68,1.5;9:-5.82,-0.71,1.5;10:-1.05,2.78,1.5"
  mqtt_prefix: homeassistant
  log_level: info
schema:
  http_port: port
  ws_port: port
  udp_port: port
  udp_allow: str
  api_token: password?
  allowed_hosts: str
  privacy_mode: bool
  node_positions: str?
  mqtt_prefix: str
  log_level: list(trace|debug|info|warn|error)
