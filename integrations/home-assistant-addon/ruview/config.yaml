name: RuView Sensing Server
version: "0.1.3"
slug: ruview
description: >-
  RuView WiFi sensing server: receives CSI from ESPHome ESP32 nodes and
  publishes presence, motion and person count to Home Assistant over MQTT.
url: https://github.com/david-dvinskykh/ruview/tree/main/integrations/home-assistant-addon
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
host_network: true
watchdog: tcp://[HOST]:[PORT:8097]
webui: http://[HOST]:[PORT:8097]/
ports:
  8097/tcp: 8097
  8096/tcp: 8096
  5005/udp: 5005
ports_description:
  8097/tcp: RuView UI and REST API
  8096/tcp: RuView WebSocket stream
  5005/udp: CSI frames from ESP32 nodes
services:
  - mqtt:need
hassio_api: true
options:
  http_port: 8097
  ws_port: 8096
  udp_port: 5005
  udp_allow: 192.168.0.0/16
  api_token: ""
  allowed_hosts: 192.168.1.1,homeassistant.local,ruview-installation.local
  privacy_mode: true
  node_positions: "1:15.04,8.38,1.5;2:37.32,11.32,1.5;3:28.93,19.96,1.5;4:40.77,1.54,1.5;5:18.97,1.32,1.5;6:34.23,19.71,1.5;7:23.79,4.60,1.5;8:18.31,9.56,1.5;9:27.65,9.45,1.5;10:13.38,19.60,1.5"
  mqtt_prefix: homeassistant
  log_level: info
schema:
  http_port: port
  ws_port: port
  udp_port: port
  udp_allow: str
  api_token: password?
  allowed_hosts: str
  privacy_mode: bool
  node_positions: str?
  mqtt_prefix: str
  log_level: list(trace|debug|info|warn|error)
